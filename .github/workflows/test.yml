name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 22
    - name: Test streaming Markdown parser
      run: node --test tests/test_smd.mjs

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install dependencies
      run: |
        pip install . --group dev
        # TEMPORARY: the plugin telemetry kit (datasette PR #2899) is not
        # in a release yet. Remove once the datasette>= floor covers it.
        pip install "datasette @ git+https://github.com/simonw/datasette@asg017/otel-phase1-6-plugin-kit"
    - name: Telemetry reference is fresh
      run: |
        python scripts/telemetry-doc.py --check
    - name: Run tests
      run: |
        python -m pytest
