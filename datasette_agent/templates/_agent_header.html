{% macro agent_header(title, export_url, export_title, model_id=None, export_open=False) %}
<div class="agent-header">
  <a class="agent-back-link" href="{{ urls.path('/-/agent') }}" aria-label="Back to conversations" title="Back to conversations">
    <svg viewBox="4 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12 19-7-7 7-7"/><path d="M5 12h14"/></svg>
  </a>
  <h1>{{ title }}</h1>
  {% if model_id %}
  <span class="agent-model-badge" title="Model used for this conversation">{{ model_id }}</span>
  {% endif %}
  <div class="chat-export-menu" data-markdown-url="{{ export_url }}" data-title="{{ export_title }}"{% if export_open %} data-open="true"{% endif %}></div>
  <div class="agent-view-switch" role="group" aria-label="View">
    <button type="button" data-agent-view="chat" aria-pressed="true">Chat</button>
    <button type="button" data-agent-view="canvas" aria-pressed="false">Canvas<span class="agent-view-switch-badge" title="The agent opened a new page"></span></button>
  </div>
  <button type="button" class="agent-canvas-toggle">Close canvas</button>
</div>
{% endmacro %}
