[project]
name = "datasette-agent"
version = "0.4a0"
description = "An LLM-powered agent assistant for Datasette"
readme = "README.md"
authors = [{name = "Simon Willison"}]
license = "Apache-2.0"
classifiers=[
    "Framework :: Datasette"
]
requires-python = ">=3.10"
dependencies = [
    "datasette>=1.0a37",
    "datasette-llm>=0.1a7",
    "llm>=0.32rc2",
    "opentelemetry-api>=1.37",
    "python-ulid",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "llm-echo>=0.5a0",
    "inline-snapshot",
    "opentelemetry-sdk>=1.37",
]

# DEV-ONLY PIN: the telemetry work imports Datasette's plugin telemetry kit
# (datasette.telemetry_registry / datasette.telemetry / datasette.telemetry_testing),
# which is public plugin API on the asg017/otel-phase1-6-plugin-kit branch
# (PR #2899) and not yet in a release. Once the stack ships, delete this
# [tool.uv.sources] block and raise the `datasette>=` floor above to the
# release that includes PR #2899. CI has a matching temporary pip step.
[tool.uv.sources]
datasette = { git = "https://github.com/simonw/datasette", branch = "asg017/otel-phase1-6-plugin-kit" }

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/datasette/datasette-agent"
Changelog = "https://github.com/datasette/datasette-agent/releases"
Issues = "https://github.com/datasette/datasette-agent/issues"
CI = "https://github.com/datasette/datasette-agent/actions"

[project.entry-points.datasette]
agent = "datasette_agent"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
include = ["datasette_agent*"]

[tool.setuptools.package-data]
datasette_agent = ["static/*", "templates/*"]
