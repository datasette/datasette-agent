[project]
name = "datasette-agent"
version = "0.4a0"
description = "An LLM-powered agent assistant for Datasette"
readme = "README.md"
authors = [{name = "Simon Willison"}]
license = "Apache-2.0"
classifiers=[
    "Framework :: Datasette"
]
requires-python = ">=3.10"
dependencies = [
    "datasette>=1.0a37",
    "datasette-llm>=0.1a7",
    "llm>=0.32rc2",
    "opentelemetry-api>=1.37",
    "python-ulid",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "llm-echo>=0.5a0",
    "inline-snapshot",
    "opentelemetry-sdk>=1.37",
]

# TEMPORARY: the llm (https://github.com/simonw/llm/pull/1712) and
# datasette-llm (https://github.com/datasette/datasette-llm/pull/8)
# OpenTelemetry PRs are not released. Remove this block, and the matching
# pip install lines in .github/workflows/, and raise the llm>= /
# datasette-llm>= floors once they ship. Do not cut a release while these
# pins exist. uv.lock is gitignored: after the upstream branches move, run
# uv sync --upgrade-package llm --upgrade-package datasette-llm
[tool.uv.sources]
llm = { git = "https://github.com/asg017/llm", branch = "asg017/otel-v2" }
datasette-llm = { git = "https://github.com/datasette/datasette-llm", branch = "asg017/otel-v2" }

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/datasette/datasette-agent"
Changelog = "https://github.com/datasette/datasette-agent/releases"
Issues = "https://github.com/datasette/datasette-agent/issues"
CI = "https://github.com/datasette/datasette-agent/actions"

[project.entry-points.datasette]
agent = "datasette_agent"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
include = ["datasette_agent*"]

[tool.setuptools.package-data]
datasette_agent = ["static/*", "templates/*"]
